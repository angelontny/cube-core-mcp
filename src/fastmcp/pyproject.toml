[project]
name = "cube-fastmcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Angelo Antony", email = "83206032+angelontny@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "google-auth>=2.62.2",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "requests>=2.34.2",
]

[project.scripts]
cube-fastmcp = "cube_fastmcp:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
