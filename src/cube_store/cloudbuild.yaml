steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['pull', 'cubejs/cubestore:${_CUBESTORE_VERSION}']
- name: 'gcr.io/cloud-builders/docker'
  args: ['tag', 'cubejs/cubestore:${_CUBESTORE_VERSION}', '${_REGION}-docker.pkg.dev/$PROJECT_ID/cube-repo/cube-store:${_CUBESTORE_VERSION}']
- name: 'gcr.io/cloud-builders/docker'
  args: ['tag', 'cubejs/cubestore:${_CUBESTORE_VERSION}', '${_REGION}-docker.pkg.dev/$PROJECT_ID/cube-repo/cube-store:latest']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/cube-repo/cube-store:${_CUBESTORE_VERSION}']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/cube-repo/cube-store:latest']
images:
- '${_REGION}-docker.pkg.dev/$PROJECT_ID/cube-repo/cube-store:${_CUBESTORE_VERSION}'
- '${_REGION}-docker.pkg.dev/$PROJECT_ID/cube-repo/cube-store:latest'
substitutions:
  _REGION: 'asia-south1'
  _CUBESTORE_VERSION: 'v0.36.0'
