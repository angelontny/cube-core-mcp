version: 2

models:
  - name: dim_products
    description: "Product dimension table enriched with category, department, and margin metrics."
    columns:
      - name: product_id
        description: "Primary key of the product."
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Product catalog title."
      - name: category
        description: "High-level merchandise category."
      - name: brand
        description: "Brand name."
      - name: profit_margin
        description: "Gross margin per unit (retail_price minus wholesale cost)."

  - name: dim_users
    description: "Customer dimension table including geography, demographics, and age brackets."
    columns:
      - name: user_id
        description: "Primary key of the user."
        tests:
          - unique
          - not_null
      - name: full_name
        description: "Concatenated first and last name."
      - name: age_bracket
        description: "Binned age segmentation (Under 20, 20-29, 30-39, etc.)."
      - name: country
        description: "User country of residence."

  - name: fct_orders
    description: "Order-level grain fact table containing total sale amounts, margins, and statuses."
    columns:
      - name: order_id
        description: "Primary key of the order."
        tests:
          - unique
          - not_null
      - name: user_id
        description: "Foreign key referencing dim_users."
      - name: total_amount
        description: "Total gross merchandise value of the order."
      - name: total_margin
        description: "Total profit margin generated by the order."

  - name: fct_order_items
    description: "Line-item grain fact table for individual product sales, delivery status, and returns."
    columns:
      - name: order_item_id
        description: "Primary key of the order line item."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key referencing fct_orders."
      - name: product_id
        description: "Foreign key referencing dim_products."
      - name: sale_price
        description: "Actual sale price paid by the customer."
      - name: gross_margin
        description: "Unit margin (sale_price - cost)."
