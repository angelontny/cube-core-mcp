cubes:
  - name: order_items
    sql_table: "{{ env_var('CUBEJS_REPORTING_TABLE_PREFIX', 'analytics') | safe }}.fct_order_items"
    description: "Line-item grain fact table for individual product sales, delivery status, and returns."

    joins:
      - name: orders
        relationship: many_to_one
        sql: "{CUBE}.order_id = {orders.order_id}"

      - name: products
        relationship: many_to_one
        sql: "{CUBE}.product_id = {products.product_id}"

      - name: users
        relationship: many_to_one
        sql: "{CUBE}.user_id = {users.user_id}"

    dimensions:
      - name: order_item_id
        sql: order_item_id
        type: number
        primary_key: true
        description: "Primary key of the order line item."

      - name: order_id
        sql: order_id
        type: number
        description: "Foreign key referencing fct_orders."

      - name: user_id
        sql: user_id
        type: number
        description: "Foreign key referencing dim_users."

      - name: product_id
        sql: product_id
        type: number
        description: "Foreign key referencing dim_products."

      - name: item_status
        sql: item_status
        type: string
        description: "Fulfillment status of this specific item."

      - name: ordered_at
        sql: ordered_at
        type: time
        description: "Timestamp when the line item was purchased."

      - name: shipped_at
        sql: shipped_at
        type: time
        description: "Timestamp when the line item was shipped."

      - name: delivered_at
        sql: delivered_at
        type: time
        description: "Timestamp when the line item was delivered."

      - name: returned_at
        sql: returned_at
        type: time
        description: "Timestamp when the line item was returned."

      - name: is_returned
        sql: is_returned
        type: boolean
        description: "Boolean flag indicating whether the line item was returned."

      - name: is_delivered
        sql: is_delivered
        type: boolean
        description: "Boolean flag indicating whether the line item was delivered."

    measures:
      - name: count
        type: count
        description: "Total count of order line items."

      - name: total_sales
        type: sum
        sql: sale_price
        description: "Total revenue from line item sales."

      - name: total_gross_margin
        type: sum
        sql: gross_margin
        description: "Total gross margin generated by line items."

      - name: average_sale_price
        type: avg
        sql: sale_price
        description: "Average price paid per unit."

      - name: returned_items_count
        type: count
        filters:
          - sql: "{CUBE}.is_returned = true"
        description: "Count of items that were returned."

      - name: delivered_items_count
        type: count
        filters:
          - sql: "{CUBE}.is_delivered = true"
        description: "Count of items successfully delivered."
